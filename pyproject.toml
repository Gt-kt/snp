[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-trade"
version = "0.1.0"
description = "Manual S&P 500 swing-trading scanner and dashboard"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "yfinance>=0.2.54",
  "requests>=2.32",
  "tabulate>=0.9",
  "python-dotenv>=1.0",
  "pytz>=2024.1",
  "alpaca-trade-api>=3.2",
  "plyer>=2.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
titan-scan = "titan_trade_v3:main"
titan-dashboard = "titan_dashboard:main"

[tool.setuptools]
py-modules = ["titan_trade_v3", "titan_dashboard", "dashboard_app"]
packages = ["titan"]
